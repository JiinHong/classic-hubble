[project]
name = "classic-hubble-pipeline"
version = "0.1.0"
description = "Data ingestion and enrichment pipeline for Classic Hubble."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.43.116,<2",
  "httpx>=0.28",
  "python-dotenv>=1.2",
]

[project.scripts]
classic-hubble-pipeline = "classic_hubble_pipeline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.0", "Pillow>=12.3,<13"]
ocr = ["Pillow>=12.3,<13", "paddleocr==3.7.0", "paddlex[ocr-core]==3.7.2", "paddlepaddle==3.3.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
